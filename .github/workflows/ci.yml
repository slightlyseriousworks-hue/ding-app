# Runs lint, typecheck, and tests on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Also generates the gitignored Expo types (expo-env.d.ts, .expo/types) first.
      - run: npm run typecheck

      - run: npm test -- --ci
